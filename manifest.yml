modules:
  macro:
    - key: texblox-macro
      resource: main
      resolver:
        function: resolver
      title: TeXBloX
      description: "Render LaTeX math blocks on your Confluence pages"
      parameters:
        - key: formula
          name: Formula
          description: Enter LaTeX code (without $$ delimiters)
          type: string
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/446c2bb7-9a68-48a6-83f6-38fc41031264
permissions:
  scopes: []