modules:
  macro:
    - key: texblox-macro
      resource: main
      resolver:
        function: resolver
      title: "LaTeX Formula"
      description: "Display mathematical formulas using LaTeX"
      categories: ["formatting"]
      layout: "inline"
      config:
        resource: config
      parameters:
        - key: formula
          name: "LaTeX Formula"
          description: "Enter your LaTeX formula (without $$ delimiters)"
          type: string
          required: true
          defaultValue: "E = mc^2"
        - key: displayMode
          name: "Display Mode"
          description: "How to display the formula"
          type: string
          required: false
          defaultValue: "inline"
          validValues:
            - "inline"
            - "block"
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static
  - key: config
    path: static-config
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/446c2bb7-9a68-48a6-83f6-38fc41031264
permissions:
  scopes:
    - read:confluence-content.summary